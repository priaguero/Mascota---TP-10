<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <div id="lugarObjeto"></div>
<script>
 
    class Mascota {
        constructor(nombre, color, tipo) {
            this.nombre = nombre;
            this.color = color;
            this.tipo = tipo;
        }

        Saludar(){
            return "Hola, soy " + this.nombre + " y soy un " + this.tipo + " de color " + this.color;
        }
    }
    
    const Mascota1 = new Mascota("Pedro", "Naranja", "Hamster");
    const Mascota2 = new Mascota("Luna", "Blanco", "Gato");
    const Mascota3 = new Mascota("Max", "Negro", "Perro");

    document.getElementById("lugarObjeto").innerHTML += "<p>" + Mascota1.Saludar() + "</p>";
    document.getElementById("lugarObjeto").innerHTML += "<p>" + Mascota2.Saludar() + "</p>";
    document.getElementById("lugarObjeto").innerHTML += "<p>" + Mascota3.Saludar() + "</p>";
    
    console.log(Mascota.Saludar());
</script>
</body>
</html>
